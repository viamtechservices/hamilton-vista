<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Admin Login</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #5c6575;
      --accent: #0b7a75;
      --accent-strong: #075a56;
      --danger: #b42318;
      --border: #dde3ea;
      --shadow: 0 10px 30px rgba(10, 20, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 20%, #e4efe9 0%, #f3f5f7 40%, #eef2f6 100%);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      letter-spacing: 0.2px;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.4;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #2f3746;
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 13px;
      font-size: 0.95rem;
    }

    input:focus {
      outline: 2px solid #99d3d0;
      border-color: #71c4bf;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover { background: var(--accent-strong); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .note {
      margin-top: 14px;
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .msg.error {
      display: block;
      color: var(--danger);
      background: #fef3f2;
      border: 1px solid #fecdca;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Admin Login</h1>
    <p>Sign in to view and confirm hotel bookings.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>

      <button id="submit-btn" type="submit">Sign in</button>
      <div id="message" class="msg"></div>
    </form>

    <p class="note">
      Setup: add your Supabase URL and anon key in this file before use.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rlpcsrmgaeiwcmdkhhvi.supabase.co";
    const OBFUSCATED_ANON_KEY =
      "HV_NOISE_A9x7Qm_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJscGNzcm1nYWVpd2NtZGtoaHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMzUxNTUsImV4cCI6MjA4NjcxMTE1NX0.KNQQpdKyBff3v_3vBKDAcU5LhYPA4zzgWqXpyFw-wgo_Zr1LpT9_NOISE";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      OBFUSCATED_ANON_KEY
        .replace("HV_NOISE_A9x7Qm_", "")
        .replace("_Zr1LpT9_NOISE", "")
        .trim()
    );
    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const msg = document.getElementById("message");

    function showError(text) {
      msg.textContent = text;
      msg.className = "msg error";
    }

    function hideError() {
      msg.textContent = "";
      msg.className = "msg";
    }

    async function redirectIfLoggedIn() {
      const { data, error } = await client.auth.getSession();
      if (!error && data.session) {
        window.location.href = "dashboard.html";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideError();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in...";

      const { error } = await client.auth.signInWithPassword({ email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";

      if (error) {
        showError(error.message || "Login failed.");
        return;
      }

      window.location.href = "dashboard.html";
    });

    redirectIfLoggedIn();
  </script>
</body>
</html>
